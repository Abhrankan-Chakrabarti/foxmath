[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foxmath"
version = "0.14.0"
description = "Minimalist CLI & library for number theory and cryptography: RSA & Diffie-Hellman cryptosystems, BSGS discrete log solver, arithmetic functions (μ, σ, τ), Jacobi symbol & Solovay–Strassen test, Pollard's ρ factorization, totient & Carmichael functions, Tonelli-Shanks roots, interactive REPL, Weierstrass elliptic curves, Chinese Remainder Theorem, and continued fractions."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Abhrankan Chakrabarti", email = "abhrankan@gmail.com"}
]
keywords = ["math", "cryptography", "cli", "number-theory", "elliptic-curves"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Security :: Cryptography",
]
requires-python = ">=3.8"
dependencies = []  # Pure stdlib for now

[project.urls]
"Homepage" = "https://github.com/Abhrankan-Chakrabarti/foxmath"
"Repository" = "https://github.com/Abhrankan-Chakrabarti/foxmath"

[project.scripts]
foxmath = "foxmath.foxmath:main"
foxmath-legendre = "foxmath.foxmath:main"
foxmath-jacobi = "foxmath.foxmath:main"
foxmath-solovay = "foxmath.foxmath:main"
foxmath-repl = "foxmath.foxmath:main"
foxmath-sqrtmod = "foxmath.foxmath:main"
foxmath-isprime = "foxmath.foxmath:main"
foxmath-factor = "foxmath.foxmath:main"
foxmath-totient = "foxmath.foxmath:main"
foxmath-order = "foxmath.foxmath:main"
foxmath-dlog = "foxmath.foxmath:main"
foxmath-mobius = "foxmath.foxmath:main"
foxmath-sigma = "foxmath.foxmath:main"
foxmath-tau = "foxmath.foxmath:main"
foxmath-egcd = "foxmath.foxmath:main"
foxmath-modinv = "foxmath.foxmath:main"
foxmath-pi = "foxmath.foxmath:main"
foxmath-ecadd = "foxmath.foxmath:main"
foxmath-ecmul = "foxmath.foxmath:main"
foxmath-crt = "foxmath.foxmath:main"
foxmath-cf = "foxmath.foxmath:main"
foxmath-challenge = "foxmath.foxmath:main"
foxmath-rsa = "foxmath.foxmath:main"
foxmath-dh = "foxmath.foxmath:main"
